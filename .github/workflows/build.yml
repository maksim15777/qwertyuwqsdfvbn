name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared/telegram-ios
          sudo rm -rf /Users/Shared/telegram-ios/*
          sudo cp -R $GITHUB_WORKSPACE/. /Users/Shared/telegram-ios/
          sudo chown -R $(whoami) /Users/Shared/telegram-ios
          cd /Users/Shared/telegram-ios
          git submodule update --init --recursive

      - name: Configure Telegram API Keys
        env:
          CUSTOM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          CUSTOM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$CUSTOM_API_ID" ] && [ -n "$CUSTOM_API_HASH" ]; then
            echo "Injecting custom Telegram API keys..."
            python3 -c "import json; f=open('build-system/appstore-configuration.json','r+'); d=json.load(f); d['api_id']='$CUSTOM_API_ID'; d['api_hash']='$CUSTOM_API_HASH'; f.seek(0); json.dump(d,f,indent=4); f.truncate()"
          else
            echo "Using default Telegram API keys (working out-of-the-box)."
          fi

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --bazelArguments="--//Telegram:disableExtensions=True --//Telegram:disableProvisioningProfiles=True" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/TelegramCustom.ipa
          done

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCustom-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/TelegramCustom.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram Custom ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: Telegram Custom (Sideloadly Dual App) for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          files: /Users/Shared/telegram-ios/build/artifacts/TelegramCustom.ipa
          draft: false
          prerelease: false
